<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>채무 기록장</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --border: #e8eaed;
  --text: #1a1a2e;
  --text2: #6b7280;
  --text3: #9ca3af;
  --green: #2d6a4f;
  --green-bg: #e8f5e9;
  --red: #c0392b;
  --red-bg: #fdecea;
  --orange: #d97706;
  --orange-bg: #fef3e2;
  --blue: #2563eb;
  --blue-bg: #eff6ff;
  --mono: 'JetBrains Mono', monospace;
  --nav-h: 60px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body { height: 100%; overflow-x: hidden; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  overscroll-behavior: none;
}

/* ── 로그인 화면 ── */
.login-screen {
  position: fixed;
  inset: 0;
  background: var(--green);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 32px 24px;
}
.login-screen.hidden { display: none; }

.login-logo {
  width: 64px; height: 64px;
  background: rgba(255,255,255,0.2);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin-bottom: 20px;
}
.login-title {
  font-size: 22px;
  font-weight: 700;
  color: white;
  margin-bottom: 6px;
}
.login-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.65);
  margin-bottom: 36px;
  text-align: center;
}
.login-box {
  background: white;
  border-radius: 20px;
  padding: 28px 24px;
  width: 100%;
  max-width: 340px;
}
.login-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
  margin-bottom: 8px;
  letter-spacing: 0.3px;
}
.login-input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 16px;
  font-family: inherit;
  color: var(--text);
  outline: none;
  margin-bottom: 12px;
  -webkit-appearance: none;
  letter-spacing: 2px;
}
.login-input:focus { border-color: var(--green); }
.login-btn {
  width: 100%;
  padding: 15px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  margin-top: 4px;
}
.login-btn:active { opacity: 0.8; }
.login-error {
  color: var(--red);
  font-size: 13px;
  text-align: center;
  margin-top: 10px;
  min-height: 20px;
  font-weight: 500;
}
.login-shake {
  animation: shake 0.4s ease;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

/* ── 앱 본문 ── */
.app-wrap { display: none; }
.app-wrap.visible { display: block; }

/* 읽기 전용 모드: 채권자 전용 요소 숨김 */
.app-wrap.read-only .creditor-only { display: none !important; }

/* ── 상단 헤더 ── */
.top-bar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.top-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.top-icon {
  width: 26px; height: 26px;
  background: var(--green);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: white;
}
.top-right {
  display: flex; align-items: center; gap: 8px;
}
.user-chip {
  font-size: 12px;
  color: var(--green);
  background: var(--green-bg);
  border: 1px solid #b7dfc8;
  border-radius: 16px;
  padding: 4px 10px;
  font-weight: 600;
}
.user-chip.debtor {
  color: var(--text2);
  background: var(--bg);
  border-color: var(--border);
}
.logout-btn {
  font-size: 12px;
  color: var(--text3);
  background: none;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 4px 10px;
  cursor: pointer;
  font-family: inherit;
}
.sync-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 16px;
  border: 1px solid;
  cursor: pointer;
  font-family: inherit;
  background: none;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.sync-chip:active { opacity: 0.7; }
.sync-ok   { color: var(--green);  border-color: #b7dfc8; background: var(--green-bg); }
.sync-none { color: var(--text3);  border-color: var(--border); background: var(--bg); }
.sync-busy { color: var(--blue);   border-color: #bfdbfe; background: var(--blue-bg); }
.sync-err  { color: var(--red);    border-color: #fca5a5; background: var(--red-bg); }

/* ── 스크롤 본문 ── */
.scroll-body {
  overflow-y: auto;
  height: calc(100vh - 52px - var(--nav-h) - var(--safe-bottom));
  -webkit-overflow-scrolling: touch;
}

/* ── 요약 섹션 ── */
.summary-wrap {
  background: var(--green);
  padding: 20px 16px 24px;
}
.summary-remaining-label {
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.summary-remaining {
  font-family: var(--mono);
  font-size: 32px;
  font-weight: 500;
  color: white;
  line-height: 1.2;
  margin-bottom: 16px;
}
.summary-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.summary-chip {
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 10px 12px;
}
.summary-chip-label {
  font-size: 11px;
  color: rgba(255,255,255,0.65);
  margin-bottom: 3px;
}
.summary-chip-value {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 500;
  color: white;
}
.promise-label {
  font-size: 11px;
  color: rgba(255,255,255,0.65);
  display: flex;
  justify-content: space-between;
  margin-bottom: 5px;
}
.promise-val { color: white; font-weight: 600; }
.promise-track {
  height: 5px;
  background: rgba(255,255,255,0.25);
  border-radius: 3px;
  overflow: hidden;
}
.promise-fill {
  height: 100%;
  background: white;
  border-radius: 3px;
  transition: width 0.5s ease;
}

/* ── 콘텐츠 ── */
.content { padding: 16px 16px 8px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.sec-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text2);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.add-btn {
  background: var(--green);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  display: flex; align-items: center; gap: 4px;
}
.add-btn:active { opacity: 0.75; }

/* ── 카드 ── */
.card-list { display: flex; flex-direction: column; gap: 10px; }
.plan-card {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  border: 1px solid var(--border);
}
.plan-card:active { transform: scale(0.99); }
.plan-card.overdue { border-left: 3px solid var(--red); }
.plan-card.on-hold { border-left: 3px solid var(--orange); }
.plan-card.done { opacity: 0.6; }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.card-left { flex: 1; min-width: 0; }
.badge-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; flex-wrap: wrap; }
.badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 4px; letter-spacing: 0.3px;
}
.badge-pending  { background: var(--blue-bg);   color: var(--blue); }
.badge-done     { background: var(--green-bg);  color: var(--green); }
.badge-hold     { background: var(--orange-bg); color: var(--orange); }
.badge-overdue  { background: var(--red-bg);    color: var(--red); }
.badge-partial  { background: #f0fdf4; color: #15803d; }

.card-date   { font-size: 12px; color: var(--text3); font-family: var(--mono); }
.card-amount { font-family: var(--mono); font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.card-memo   { font-size: 12px; color: var(--text3); }
.card-paid-info { font-size: 12px; color: var(--green); font-family: var(--mono); margin-top: 2px; }

.recorder-tag {
  font-size: 11px;
  color: var(--text3);
  margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}
.recorder-name { color: var(--text2); font-weight: 600; }

.card-actions { display: flex; gap: 6px; margin-top: 12px; }
.act-btn {
  flex: 1; padding: 9px 0;
  border-radius: 8px; font-size: 13px; font-weight: 600;
  font-family: inherit; border: none; cursor: pointer; text-align: center;
}
.act-btn:active { opacity: 0.75; }
.act-confirm { background: var(--blue-bg); color: var(--blue); }
.act-hold    { background: var(--orange-bg); color: var(--orange); }

/* 보류 히스토리 */
.hold-hist { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.hold-hist-title {
  font-size: 11px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
}
.hold-row { display: flex; gap: 8px; padding: 6px 0; font-size: 12px; color: var(--text2); border-top: 1px solid var(--border); }
.hold-row:first-of-type { border-top: none; }
.hold-circle { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); margin-top: 4px; flex-shrink: 0; }
.hold-info { flex: 1; }
.hold-dates { font-family: var(--mono); font-size: 11px; color: var(--text3); }
.hold-reason { margin-top: 2px; }
.hold-by { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* 입금 내역 */
.pay-list { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.pay-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 12px; border-top: 1px solid var(--border); }
.pay-row:first-of-type { border-top: none; }
.pay-d { color: var(--text3); font-family: var(--mono); }
.pay-a { color: var(--green); font-family: var(--mono); font-weight: 600; }
.pay-by { font-size: 11px; color: var(--text3); }
.pay-total-row { display: flex; justify-content: space-between; padding: 6px 0 0; margin-top: 4px; border-top: 1px solid var(--border); font-size: 12px; font-weight: 600; }

/* ── 타임라인 ── */
.tl { display: flex; flex-direction: column; }
.tl-row { display: flex; gap: 12px; padding-bottom: 16px; position: relative; }
.tl-side { display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; background: white; z-index: 1; margin-top: 3px; flex-shrink: 0; }
.tl-dot.d-loan { border-color: var(--text); background: var(--text); }
.tl-dot.d-plan { border-color: var(--blue); }
.tl-dot.d-hold { border-color: var(--orange); background: var(--orange); }
.tl-dot.d-pay  { border-color: var(--green); background: var(--green); }
.tl-line-v { flex: 1; width: 1px; background: var(--border); margin-top: 3px; }
.tl-row:last-child .tl-line-v { display: none; }
.tl-body { flex: 1; padding-top: 0; }
.tl-ts { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
.tl-who { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1px 6px; font-size: 10px; font-weight: 600; color: var(--text2); }
.tl-content-text { font-size: 13px; color: var(--text); line-height: 1.5; }
.tl-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.tl-tag-loan { background: #f3f4f6; color: var(--text2); }
.tl-tag-plan { background: var(--blue-bg); color: var(--blue); }
.tl-tag-hold { background: var(--orange-bg); color: var(--orange); }
.tl-tag-pay  { background: var(--green-bg); color: var(--green); }

/* ── 빈 상태 ── */
.empty { text-align: center; padding: 48px 20px; color: var(--text3); }
.empty-emoji { font-size: 28px; margin-bottom: 10px; }
.empty-msg { font-size: 14px; }

/* ── 하단 탭바 ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; align-items: flex-start; padding-top: 6px; z-index: 50;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; cursor: pointer; padding: 6px 0;
  font-family: inherit; position: relative;
}
.nav-item:active { opacity: 0.6; }
.nav-icon { font-size: 20px; line-height: 1; }
.nav-label { font-size: 10px; font-weight: 500; color: var(--text3); }
.nav-item.active .nav-label { color: var(--green); font-weight: 700; }
.nav-count {
  position: absolute; top: 2px; right: calc(50% - 18px);
  background: var(--red); color: white;
  font-size: 9px; font-weight: 700; min-width: 16px; height: 16px;
  border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px;
}

/* ── 바텀시트 ── */
.sheet-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.sheet-backdrop.open { display: flex; }
.sheet {
  background: white; border-radius: 20px 20px 0 0;
  padding: 0 0 calc(24px + var(--safe-bottom));
  width: 100%; max-width: 480px; max-height: 90vh;
  overflow-y: auto; animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
.sheet-title { font-size: 17px; font-weight: 700; padding: 16px 20px 12px; color: var(--text); }
.sheet-body { padding: 0 20px; }
.notice {
  background: #fff8e1; border: 1px solid #ffe082; border-radius: 10px;
  padding: 10px 12px; font-size: 12px; color: #b45309; margin-bottom: 16px;
  display: flex; gap: 6px;
}
.form-g { margin-bottom: 16px; }
.form-lbl { display: block; font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.3px; }
.form-inp {
  width: 100%; padding: 13px 14px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 15px; font-family: inherit; color: var(--text);
  background: white; outline: none; -webkit-appearance: none;
}
.form-inp:focus { border-color: var(--green); }
.form-inp.mono { font-family: var(--mono); }
.form-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
.sheet-actions { display: flex; gap: 8px; padding: 16px 20px 0; }
.sheet-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; font-family: inherit; border: none; cursor: pointer; }
.sheet-btn:active { opacity: 0.75; }
.sheet-cancel  { background: var(--bg); color: var(--text2); }
.sheet-ok-green { background: var(--green); color: white; }
.sheet-ok-blue  { background: var(--blue); color: white; }
.sheet-ok-orange{ background: var(--orange); color: white; }
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div class="login-screen" id="loginScreen">
  <div class="login-logo">₩</div>
  <div class="login-title">채무 기록장</div>
  <div class="login-sub">접근 권한이 있는 사용자만<br>이용할 수 있습니다</div>
  <div class="login-box" id="loginBox">
    <div class="login-label">비밀번호 입력</div>
    <input
      type="password"
      class="login-input"
      id="pwInput"
      placeholder="비밀번호를 입력하세요"
      onkeydown="if(event.key==='Enter') tryLogin()"
      autocomplete="off"
    >
    <button class="login-btn" onclick="tryLogin()">확인</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ── 앱 본문 ── -->
<div class="app-wrap" id="appWrap">

  <!-- 상단 헤더 -->
  <div class="top-bar">
    <div class="top-title">
      <div class="top-icon">₩</div>
      채무 기록장
    </div>
    <div class="top-right">
      <button class="sync-chip sync-none" id="syncChip" onclick="manualSync()">☁ 미연결</button>
      <span class="user-chip" id="userChip"></span>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <!-- 스크롤 본문 -->
  <div class="scroll-body" id="scrollBody">

    <!-- 요약 -->
    <div class="summary-wrap">
      <div class="summary-remaining-label">현재 잔액</div>
      <div class="summary-remaining" id="sumRemaining">—</div>
      <div class="summary-row">
        <div class="summary-chip">
          <div class="summary-chip-label">빌려준 금액</div>
          <div class="summary-chip-value" id="sumLoan">—</div>
        </div>
        <div class="summary-chip">
          <div class="summary-chip-label">총 상환액</div>
          <div class="summary-chip-value" id="sumPaid">—</div>
        </div>
      </div>
      <div>
        <div class="promise-label">
          <span>약속 이행률</span>
          <span class="promise-val" id="promiseRateText">0%</span>
        </div>
        <div class="promise-track">
          <div class="promise-fill" id="promiseFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- 탭 패널 -->
    <div class="content">

      <!-- 계획 탭 -->
      <div class="tab-panel active" id="tab-plans">
        <div class="sec-head">
          <div class="sec-title">입금 계획</div>
          <button class="add-btn" onclick="openSheet('addPlan')">+ 계획 추가</button>
        </div>
        <div class="card-list" id="planList">
          <div class="empty"><div class="empty-emoji">📋</div><div class="empty-msg">등록된 계획이 없습니다</div></div>
        </div>
      </div>

      <!-- 타임라인 탭 -->
      <div class="tab-panel" id="tab-timeline">
        <div class="sec-head">
          <div class="sec-title">전체 기록</div>
          <button class="add-btn" style="background:var(--blue)" onclick="downloadExcel()">⬇ 엑셀 저장</button>
        </div>
        <div class="tl" id="timelineList">
          <div class="empty"><div class="empty-emoji">📜</div><div class="empty-msg">기록이 없습니다</div></div>
        </div>
      </div>

    </div>
  </div>

  <!-- 하단 탭바 -->
  <div class="bottom-nav">
    <button class="nav-item active" id="nav-plans" onclick="switchTab('plans')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">입금 계획</span>
      <span class="nav-count" id="pendingCount" style="display:none"></span>
    </button>
    <button class="nav-item" id="nav-timeline" onclick="switchTab('timeline')">
      <span class="nav-icon">📜</span>
      <span class="nav-label">전체 기록</span>
    </button>
  </div>

</div><!-- /app-wrap -->

<div class="sheet-backdrop" id="sheet-setupLoan">

  <div class="sheet">

      <div class="notice">⚠️ 등록 후 수정 불가. 변경 시 보류 처리만 가능합니다.</div>

        <label class="form-lbl">예정 금액 (원)</label>

      </div>

<div class="sheet-backdrop" id="sheet-hold" onclick="outsideClose(event,'hold')">
  <div class="sheet">

    <div class="sheet-body">

<!-- ── 바텀시트: 입금 확인 (채권자 전용) ── -->
<div class="sheet-backdrop" id="sheet-confirm" onclick="outsideClose(event,'confirm')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">✅ 실제 입금 확인</div>
    <div class="sheet-body">
      <div class="notice">⚠️ 확인 후 수정이 불가능합니다.</div>
      <input type="hidden" id="confirmPlanId">
      <div class="form-g">
        <label class="form-lbl">실제 입금일</label>
        <input type="date" class="form-inp" id="confirmDate">
      </div>

        <label class="form-lbl">실제 입금액 (원)</label>
        <input type="number" class="form-inp mono" id="confirmAmount" placeholder="실제로 입금된 금액" inputmode="numeric">
        <div class="form-hint" id="confirmHint"></div>
      </div>

        <label class="form-lbl">메모 (선택)</label>

      <button class="sheet-btn sheet-cancel" onclick="closeSheet('confirm')">취소</button>
      <button class="sheet-btn sheet-ok-blue" onclick="saveConfirm()">입금 확인</button>
    </div>
  </div>
</div>


<script>
const USERS = {
  '77896498': { name: '박선우', role: 'creditor' },
  '54343683': { name: '심원보', role: 'debtor' }
};

const SERVER_URL = 'https://wonbiseo.co.kr';

let S = { loan: null, plans: [], timeline: [] };
let currentUser = null;

// ── 서버 동기화 ──
function authPassword() { return currentUser ? currentUser.password : ''; }

function setSyncUI(state, label) {
  const chip = document.getElementById('syncChip');
  if (!chip) return;
  chip.className = 'sync-chip sync-' + state;
  chip.textContent = label;
}

async function serverLoad() {
  try {
    const resp = await fetch(SERVER_URL + '/debt/state', {
      headers: { 'x-debt-password': authPassword() }
    });
    if (resp.ok) {
      const data = await resp.json();
      return data.state || null;
    }
  } catch(e) {}
  return null;
}

async function serverSave(data) {
  setSyncUI('busy', '🔄 저장 중');
  try {
    const resp = await fetch(SERVER_URL + '/debt/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-debt-password': authPassword() },
      body: JSON.stringify({ state: data })
    });
    setSyncUI(resp.ok ? 'ok' : 'err', resp.ok ? '☁ 동기화됨' : '⚠ 오류');
  } catch(e) {
    setSyncUI('err', '⚠ 오류');
  }
}

function manualSync() {
  if (!currentUser) return;
  loadAndRender();
}

// ── 로그인 ──
function tryLogin() {
  const pw = document.getElementById('pwInput').value;
  const user = USERS[pw];
  if (user) {
    currentUser = { ...user, password: pw };
    const appWrap = document.getElementById('appWrap');
    appWrap.classList.add('visible');
    // 채무자는 읽기 전용 모드
    if (user.role === 'debtor') {
      appWrap.classList.add('read-only');
    } else {
      appWrap.classList.remove('read-only');
    }
    document.getElementById('loginScreen').classList.add('hidden');
    const chip = document.getElementById('userChip');
    chip.textContent = user.name + (user.role === 'debtor' ? ' (읽기전용)' : '');
    chip.className = 'user-chip' + (user.role === 'debtor' ? ' debtor' : '');
    loadAndRender();
  } else {
    const box = document.getElementById('loginBox');
    document.getElementById('loginError').textContent = '비밀번호가 맞지 않습니다.';
    box.classList.remove('login-shake');
    void box.offsetWidth;
    box.classList.add('login-shake');
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function logout() {
  currentUser = null;
  S = { loan: null, plans: [], timeline: [] };
  document.getElementById('pwInput').value = '';
  document.getElementById('loginError').textContent = '';
  const appWrap = document.getElementById('appWrap');
  appWrap.classList.remove('visible', 'read-only');
  document.getElementById('loginScreen').classList.remove('hidden');
  setSyncUI('none', '☁ 미연결');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-plans').classList.add('active');
  document.getElementById('nav-plans').classList.add('active');
}

// ── 데이터 ──
function save() {
  localStorage.setItem('dbt_v2', JSON.stringify(S));
  serverSave(S); // 비동기 서버 저장 (실패해도 localStorage 유지)
}

async function loadAndRender() {
  setSyncUI('busy', '🔄 로딩 중');

  const serverData = await serverLoad();
  const lsRaw  = localStorage.getItem('dbt_v2');
  const lsData = lsRaw ? JSON.parse(lsRaw) : null;

  if (serverData) {
    S = serverData;
    localStorage.setItem('dbt_v2', JSON.stringify(S));
    setSyncUI('ok', '☁ 동기화됨');
  } else if (lsData) {
    S = lsData;
    await serverSave(S); // 기존 로컬 데이터를 서버로 최초 업로드
  } else {
    S = { loan: null, plans: [], timeline: [] };
    setSyncUI('ok', '☁ 연결됨');
  }

  if (!S.loan && currentUser.role === 'creditor') {
    document.getElementById('loanDate').value = today();
    openSheet('setupLoan');
  }
  render();
}

function today() { return new Date().toISOString().split('T')[0]; }
function uid()   { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function money(n){ return Number(n).toLocaleString('ko-KR') + '원'; }
function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
}
function fmtDateFull(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
}
function fmtTs(iso) {
  return new Date(iso).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ── 탭 ──
function switchTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
  document.getElementById('scrollBody').scrollTop = 0;
}

// ── 시트 ──
function openSheet(id) { document.getElementById('sheet-' + id).classList.add('open'); }
function closeSheet(id){ document.getElementById('sheet-' + id).classList.remove('open'); }
function outsideClose(e, id) {
  if (e.target === document.getElementById('sheet-' + id)) closeSheet(id);
}

// ── 대출 등록 (채권자 전용) ──
function saveLoan() {
  if (currentUser.role !== 'creditor') return;
  const amount = parseInt(document.getElementById('loanAmount').value);
  const date   = document.getElementById('loanDate').value;
  const memo   = document.getElementById('loanMemo').value.trim();
  if (!amount || amount <= 0) return alert('금액을 입력해주세요.');
  if (!date) return alert('대출일을 입력해주세요.');
  S.loan = { amount, date, memo, createdAt: new Date().toISOString(), by: currentUser.name };
  S.timeline.unshift({ type:'loan', date, amount, memo, by: currentUser.name, createdAt: new Date().toISOString() });
  save(); closeSheet('setupLoan'); render();
}

// ── 계획 추가 (채권자 + 채무자 모두 가능) ──
function savePlan() {
  if (!currentUser) return;
  const date   = document.getElementById('planDate').value;
  const amount = parseInt(document.getElementById('planAmount').value);
  const memo   = document.getElementById('planMemo').value.trim();
  if (!date)              return alert('날짜를 입력해주세요.');
  if (!amount || amount <= 0) return alert('금액을 입력해주세요.');
  const plan = {
    id: uid(), date, amount, memo,
    status: 'pending',
    createdAt: new Date().toISOString(),
    by: currentUser.name,
    holdHistory: [], payments: []
  };
  S.plans.push(plan);
  S.timeline.unshift({ type:'plan', date, amount, memo, planId: plan.id, by: currentUser.name, createdAt: new Date().toISOString() });
  save(); closeSheet('addPlan');
  ['planDate','planAmount','planMemo'].forEach(id => document.getElementById(id).value = '');
  render();
}

// ── 보류 (채권자 전용) ──
function openHold(planId) {
  if (currentUser.role !== 'creditor') return;
  document.getElementById('holdPlanId').value = planId;
  ['holdReason','holdNewDate','holdNewAmount'].forEach(id => document.getElementById(id).value = '');
  openSheet('hold');
}
function saveHold() {
  if (currentUser.role !== 'creditor') return;
  const planId  = document.getElementById('holdPlanId').value;
  const reason  = document.getElementById('holdReason').value.trim();
  const newDate = document.getElementById('holdNewDate').value;
  const rawAmt  = document.getElementById('holdNewAmount').value;
  if (!reason)  return alert('보류 사유를 입력해주세요.');
  if (!newDate) return alert('변경된 예정일을 입력해주세요.');
  const plan = S.plans.find(p => p.id === planId);
  if (!plan) return;
  const newAmount = rawAmt ? parseInt(rawAmt) : plan.amount;
  const rec = {
    id: uid(), reason,
    originalDate: plan.date, originalAmount: plan.amount,
    newDate, newAmount,
    by: currentUser.name,
    createdAt: new Date().toISOString()
  };
  plan.holdHistory.push(rec);
  S.timeline.unshift({ type:'hold', date: today(), planId, reason, oldDate: plan.date, newDate, oldAmount: plan.amount, newAmount, by: currentUser.name, createdAt: new Date().toISOString() });
  plan.date = newDate; plan.amount = newAmount; plan.status = 'hold';
  save(); closeSheet('hold'); render();
}

// ── 입금 확인 (채권자 전용) ──
function openConfirm(planId) {
  if (currentUser.role !== 'creditor') return;
  const plan = S.plans.find(p => p.id === planId);
  document.getElementById('confirmPlanId').value = planId;
  document.getElementById('confirmDate').value   = today();
  document.getElementById('confirmAmount').value = '';
  document.getElementById('confirmMemo').value   = '';
  document.getElementById('confirmHint').textContent = '계획 금액: ' + money(plan.amount);
  openSheet('confirm');
}
function saveConfirm() {
  if (currentUser.role !== 'creditor') return;
  const planId = document.getElementById('confirmPlanId').value;
  const date   = document.getElementById('confirmDate').value;
  const amount = parseInt(document.getElementById('confirmAmount').value);
  const memo   = document.getElementById('confirmMemo').value.trim();
  if (!date)              return alert('입금일을 입력해주세요.');
  if (!amount || amount <= 0) return alert('금액을 입력해주세요.');
  const plan = S.plans.find(p => p.id === planId);
  if (!plan) return;
  const payment = { id: uid(), date, amount, memo, by: currentUser.name, createdAt: new Date().toISOString() };
  plan.payments.push(payment);
  const paidSum = plan.payments.reduce((s,p) => s+p.amount, 0);
  plan.status = paidSum >= plan.amount ? 'completed' : 'partial';
  S.timeline.unshift({ type:'payment', date, amount, memo, planId, by: currentUser.name, createdAt: new Date().toISOString() });
  save(); closeSheet('confirm'); render();
}

// ── 렌더 ──
function render() { renderSummary(); renderPlans(); renderTimeline(); }

function renderSummary() {
  if (!S.loan) return;
  const totalPaid = S.plans.reduce((s,p) => s + p.payments.reduce((a,pay) => a+pay.amount, 0), 0);
  const remaining = S.loan.amount - totalPaid;
  const completed = S.plans.filter(p => p.status === 'completed').length;
  const totalHolds= S.plans.reduce((s,p) => s+p.holdHistory.length, 0);
  const rate = S.plans.length > 0
    ? Math.max(0, Math.round(completed / S.plans.length * 100 - totalHolds * 3))
    : 0;
  document.getElementById('sumRemaining').textContent   = money(remaining);
  document.getElementById('sumLoan').textContent        = money(S.loan.amount);
  document.getElementById('sumPaid').textContent        = money(totalPaid);
  document.getElementById('promiseFill').style.width    = rate + '%';
  document.getElementById('promiseRateText').textContent= rate + '%';
  const pending = S.plans.filter(p => p.status !== 'completed').length;
  const badge = document.getElementById('pendingCount');
  badge.style.display = pending > 0 ? 'flex' : 'none';
  if (pending > 0) badge.textContent = pending;
}

function renderPlans() {
  const list = document.getElementById('planList');
  if (S.plans.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-emoji">📋</div><div class="empty-msg">등록된 계획이 없습니다</div></div>`;
    return;
  }
  const t = today();
  const sorted = [...S.plans].sort((a,b) => {
    const ao = a.status === 'completed' ? 1 : 0;
    const bo = b.status === 'completed' ? 1 : 0;
    if (ao !== bo) return ao - bo;
    return a.date.localeCompare(b.date);
  });
  list.innerHTML = sorted.map(plan => {
    const isOverdue = plan.status === 'pending' && plan.date < t;
    const paidSum = plan.payments.reduce((s,p) => s+p.amount, 0);
    let badge='', cardCls='';
    if      (plan.status==='completed')  { badge=`<span class="badge badge-done">완료</span>`;     cardCls='done'; }
    else if (plan.status==='partial')    { badge=`<span class="badge badge-partial">부분완료</span>`; }
    else if (plan.status==='hold')       { badge=`<span class="badge badge-hold">보류</span>`;     cardCls='on-hold'; }
    else if (isOverdue)                  { badge=`<span class="badge badge-overdue">연체</span>`;   cardCls='overdue'; }
    else                                 { badge=`<span class="badge badge-pending">예정</span>`; }

    const holdHtml = plan.holdHistory.length > 0 ? `
      <div class="hold-hist">
        <div class="hold-hist-title">⚠️ 보류 기록 ${plan.holdHistory.length}회</div>
        ${plan.holdHistory.map(h => `
          <div class="hold-row">
            <div class="hold-circle"></div>
            <div class="hold-info">
              <div class="hold-dates">${fmtDate(h.originalDate)} → ${fmtDate(h.newDate)}${h.originalAmount!==h.newAmount?' · '+money(h.originalAmount)+' → '+money(h.newAmount):''}</div>
              ${h.reason ? `<div class="hold-reason">"${h.reason}"</div>` : ''}
              <div class="hold-by">기록: ${h.by} · ${fmtTs(h.createdAt)}</div>
            </div>
          </div>`).join('')}
      </div>` : '';

    const payHtml = plan.payments.length > 0 ? `
      <div class="pay-list">
        ${plan.payments.map(p => `
          <div class="pay-row">
            <div>
              <span class="pay-d">${fmtDate(p.date)}${p.memo?' · '+p.memo:''}</span>
              <div class="pay-by">기록: ${p.by}</div>
            </div>
            <span class="pay-a">+${money(p.amount)}</span>
          </div>`).join('')}
        <div class="pay-total-row">
          <span style="color:var(--text3);font-size:12px">입금 합계</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--green)">${money(paidSum)} / ${money(plan.amount)}</span>
        </div>
      </div>` : '';

    // 수정/액션 버튼은 채권자(77896498)만 표시
    const canAct = plan.status !== 'completed' && currentUser.role === 'creditor';
    const actHtml = canAct ? `
      <div class="card-actions">
        <button class="act-btn act-confirm" onclick="openConfirm('${plan.id}')">✅ 입금 확인</button>
        <button class="act-btn act-hold"    onclick="openHold('${plan.id}')">⏸ 보류</button>
      </div>` : '';

    return `
      <div class="plan-card ${cardCls}">
        <div class="card-top">
          <div class="card-left">
            <div class="badge-row">${badge}<span class="card-date">${fmtDateFull(plan.date)}</span></div>
            <div class="card-amount">${money(plan.amount)}</div>
            ${plan.memo ? `<div class="card-memo">${plan.memo}</div>` : ''}
            ${paidSum > 0 && plan.status !== 'completed' ? `<div class="card-paid-info">입금 ${money(paidSum)} · 잔여 ${money(plan.amount-paidSum)}</div>` : ''}
            <div class="recorder-tag">📝 <span class="recorder-name">${plan.by}</span> 등록 · ${fmtTs(plan.createdAt)}</div>
          </div>
        </div>
        ${holdHtml}
        ${payHtml}
        ${actHtml}
      </div>`;
  }).join('');
}

function renderTimeline() {
  const list = document.getElementById('timelineList');
  if (S.timeline.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-emoji">📜</div><div class="empty-msg">기록이 없습니다</div></div>`;
    return;
  }
  list.innerHTML = S.timeline.map(ev => {
    let dotCls='', tag='', detail='';
    if (ev.type==='loan') {
      dotCls='d-loan'; tag=`<span class="tl-tag tl-tag-loan">대출 등록</span>`;
      detail=`<strong style="font-family:var(--mono)">${money(ev.amount)}</strong>${ev.memo?' · '+ev.memo:''}`;
    } else if (ev.type==='plan') {
      dotCls='d-plan'; tag=`<span class="tl-tag tl-tag-plan">계획 등록</span>`;
      detail=`${fmtDate(ev.date)} <strong style="font-family:var(--mono)">${money(ev.amount)}</strong>${ev.memo?' · '+ev.memo:''}`;
    } else if (ev.type==='hold') {
      dotCls='d-hold'; tag=`<span class="tl-tag tl-tag-hold">보류</span>`;
      detail=`${fmtDate(ev.oldDate)} → ${fmtDate(ev.newDate)}`;
      if (ev.oldAmount!==ev.newAmount) detail+=` · ${money(ev.oldAmount)} → ${money(ev.newAmount)}`;
      if (ev.reason) detail+=`<br><span style="color:var(--text3);font-size:12px">"${ev.reason}"</span>`;
    } else if (ev.type==='payment') {
      dotCls='d-pay'; tag=`<span class="tl-tag tl-tag-pay">입금 확인</span>`;
      detail=`${fmtDate(ev.date)} <strong style="font-family:var(--mono);color:var(--green)">+${money(ev.amount)}</strong>${ev.memo?' · '+ev.memo:''}`;
    }
    return `
      <div class="tl-row">
        <div class="tl-side">
          <div class="tl-dot ${dotCls}"></div>
          <div class="tl-line-v"></div>
        </div>
        <div class="tl-body">
          <div class="tl-ts">${fmtTs(ev.createdAt)} <span class="tl-who">${ev.by}</span></div>
          <div class="tl-content-text">${tag} ${detail}</div>
        </div>
      </div>`;
  }).join('');
}

function downloadExcel() {
  if (!S.timeline.length) return alert('내보낼 기록이 없습니다.');

  const TYPE_LABEL = { loan: '대출 등록', plan: '계획 등록', hold: '보류', payment: '입금 확인' };

  const header = ['구분', '날짜', '금액(원)', '변경 전 날짜', '변경 후 날짜', '메모/사유', '기록자', '등록시각'];

  const rows = S.timeline.map(ev => {
    let date = '', amount = '', oldDate = '', newDate = '', memo = '';
    if (ev.type === 'loan') {
      date = ev.date; amount = ev.amount; memo = ev.memo || '';
    } else if (ev.type === 'plan') {
      date = ev.date; amount = ev.amount; memo = ev.memo || '';
    } else if (ev.type === 'hold') {
      date = ev.newDate; amount = ev.newAmount || '';
      oldDate = ev.oldDate; newDate = ev.newDate;
      memo = ev.reason || '';
    } else if (ev.type === 'payment') {
      date = ev.date; amount = ev.amount; memo = ev.memo || '';
    }
    return [TYPE_LABEL[ev.type] || ev.type, date, amount, oldDate, newDate, memo, ev.by, fmtTs(ev.createdAt)];
  });

  const csv = '﻿' + [header, ...rows]
    .map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(','))
    .join('\r\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = '채무기록_' + today() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
